name: deploy-api

# Deploys the upload API (Worker + Container, deploy/api) to Cloudflare after CI passes on main, so a merge
# reaches api.audiences.nofluffadvisory.com without anyone running wrangler by hand. Needs two repository
# secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, Containers: Edit) and CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping the API deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/api/package-lock.json
      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        working-directory: deploy/api
        run: |
          npm ci
          npx wrangler deploy
      - name: Check the live API
        if: steps.creds.outputs.ok == 'true'
        run: |
          for i in $(seq 1 20); do
            if curl -fsS https://api.audiences.nofluffadvisory.com/healthz; then echo; exit 0; fi
            sleep 15
          done
          echo "::error::/healthz did not answer within 5 minutes of the deploy"
          exit 1
