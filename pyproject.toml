[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-audience-intelligence"
version = "0.1.0"
description = "Provider-agnostic audience intelligence: contracts, task routing, bounded agents and evaluation scaffolding."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.21",
  "referencing>=0.31",
  "numpy>=1.26",
]

[project.optional-dependencies]
modeling = ["scikit-learn>=1.4"]
llm = ["anthropic>=0.40"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27"]

[project.scripts]
aip = "aip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
